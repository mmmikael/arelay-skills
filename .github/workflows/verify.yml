name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Node scripts
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find skills -name '*.mjs' -print0)
